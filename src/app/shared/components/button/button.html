<!-- button.component.html -->
<button
  [type]="type"
  [class]="buttonClasses"
  [disabled]="disabled"
  (click)="onClick($event)"
>
  <ng-content select="[prefix]"></ng-content>

  <span class="tracking-tight">
    <ng-content></ng-content>
  </span>

  <ng-content select="[postfix]"></ng-content>
</button>

<div
  *ngFor="let item of skeletonItems; trackBy: trackByIndex"
  [ngClass]="getClassNames()"
  [class]="customClass"
  [style]="getStyleObject()"
>
  <ng-container *ngIf="type === 'table'; else defaultSkeleton">
    <div class="w-full bg-white rounded-2xl shadow-ims-card overflow-hidden">
      <div class="flex p-4 bg-gray-50">
        <div
          class="flex-1 h-6 mr-4 bg-gray-200 rounded-sm"
          *ngFor="let col of tableColumns"
        ></div>
      </div>
      <div class="divide-y divide-gray-200">
        <div class="flex p-4" *ngFor="let row of tableRows">
          <div
            class="flex-1 h-6 mr-4 bg-gray-50 rounded-sm"
            *ngFor="let col of tableColumns"
          ></div>
        </div>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="type === 'sidebar'; else defaultSkeleton">
    <div
      class="w-64 h-screen bg-white border-r border-gray-200 shadow-lg rounded-2xl p-4 flex flex-col"
    >
      <div class="h-10 w-10 bg-gray-200 rounded-sm mb-4"></div>
      <div class="h-10 bg-gray-50 border border-gray-200 rounded-lg mb-4"></div>
      <div class="flex-1 flex flex-col gap-2 mt-4">
        <div
          class="h-10 bg-gray-50 rounded-lg"
          *ngFor="let item of menuItems"
        ></div>
      </div>
      <div
        class="pt-4 border-t border-gray-200 flex items-center justify-between"
      >
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-gray-200 rounded-full"></div>
          <div class="flex-1">
            <div class="h-3.5 w-24 bg-gray-200 mb-1"></div>
            <div class="h-3 w-16 bg-gray-200"></div>
          </div>
        </div>
        <div class="w-8 h-8 bg-gray-200 rounded-lg"></div>
      </div>
    </div>
  </ng-container>

  <ng-template #defaultSkeleton> </ng-template>
</div>

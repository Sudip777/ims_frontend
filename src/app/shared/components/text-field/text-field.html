<div class="flex flex-col w-full mb-5">
  <!-- Label -->
  @if (label) {
    <label
      [attr.for]="uniqueId"
      class="block text-sm font-medium text-colors-ims-text-primary mb-2 leading-tight font-sans">
      {{ label }}
      @if (required) {
        <span class="text-red-600 ml-0.5">*</span>
      }
    </label>
  }

  <!-- Input Container -->
  <div
    [ngClass]="{
      'border-2 border-dashed border-blue-500 bg-slate-50': focused && !error,
      'border-red-600 bg-red-50': error,
      'border-gray-300 bg-white': !focused && !error,
      'bg-gray-100 border-gray-300 cursor-not-allowed opacity-60': disabled,
      'hover:border-gray-400': !disabled && !focused && !error
    }"
    class="flex items-center border-[1.5px] rounded-lg px-4 py-3.5 transition-all duration-200">

    <!-- Prefix -->
    @if (prefix) {
      <span class="text-[11px] text-gray-600 mr-2 whitespace-nowrap select-none font-sans">
        {{ prefix }}
      </span>
    }

    <!-- Input -->
    <input
      [id]="uniqueId"
      [type]="inputType"
      [value]="value"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [readonly]="readonly"
      [required]="required"
      [pattern]="pattern"
      [attr.autocomplete]="autocomplete"
      (input)="onInput($event)"
      (blur)="onBlur($event)"
      (focus)="onFocus($event)"
      [ngClass]="{
        'text-lg tracking-[2px]': type === 'password' && value,
        'placeholder:tracking-normal placeholder:text-[15px]': type === 'password'
      }"
      class="flex-1 border-none outline-none bg-transparent text-[15px] text-gray-900 placeholder:text-gray-400 placeholder:font-normal disabled:cursor-not-allowed disabled:text-gray-600"
    />

    <!-- Suffix -->
    @if (suffix) {
      <span class="text-[11px] text-gray-600 ml-2 whitespace-nowrap select-none font-sans">
        {{ suffix }}
      </span>
    }
  </div>

  <!-- Helper Text / Error Message -->
  @if (helperText) {
    <div class="flex items-center gap-1.5 mt-1.5 font-sans">
      @if (error) {
        <svg
          class="flex-shrink-0"
          width="12"
          height="12"
          viewBox="0 0 12 12"
          fill="none">
          <path
            d="M6 0C2.68629 0 0 2.68629 0 6C0 9.31371 2.68629 12 6 12C9.31371 12 12 9.31371 12 6C12 2.68629 9.31371 0 6 0ZM6.6 8.4H5.4V7.2H6.6V8.4ZM6.6 6H5.4V3.6H6.6V6Z"
            fill="#DC362E"/>
        </svg>
      }
      <p
        [ngClass]="{'text-red-600': error, 'text-gray-600': !error}"
        class="text-xs leading-tight m-0">
        {{ helperText }}
      </p>
    </div>
  }

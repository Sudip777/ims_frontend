<div class="flex flex-col w-full mb-4">
  @if (label) {
    <label
      [attr.for]="uniqueId"
      class="block text-sm font-medium text-ims-text-primary mb-1.5 leading-5 font-sans"
    >
      {{ label }}
      @if (required) {
        <span class="text-ims-error ml-1">*</span>
      }
    </label>
  }

  <div
    [ngClass]="{
      'border border-ims-primary bg-ims-bg-light': focused && !error,
      'border-ims-error bg-ims-surface': error,
      'border-ims-border bg-ims-surface': !focused && !error,
      'bg-ims-bg-light/50 border-ims-border-dark cursor-not-allowed opacity-70': disabled,
      'hover:border-ims-primary-hover': !disabled && !focused && !error,
    }"
    class="flex items-center border-solid rounded-md px-3 py-2 transition-all duration-200 border-gray-100"
  >
    @if (prefix) {
      <span class="text-xs text-ims-text-secondary mr-1.5 whitespace-nowrap select-none font-sans">
        {{ prefix }}
      </span>
    }

    <input
      [id]="uniqueId"
      [type]="inputType"
      [value]="value"
      [placeholder]="placeholder"
      [disabled]="disabled"
      [readonly]="readonly"
      [required]="required"
      [pattern]="pattern"
      [attr.autocomplete]="autocomplete"
      (input)="onInput($event)"
      (blur)="onBlur($event)"
      (focus)="onFocus($event)"
      [ngClass]="{
        'text-base tracking-[1px]': type === 'password' && value,
        'placeholder:tracking-normal placeholder:text-sm': type === 'password',
      }"
      class="flex-1 border-none outline-none bg-transparent text-sm text-ims-text-primary placeholder:text-ims-text-tertiary placeholder:font-normal disabled:cursor-not-allowed disabled:text-ims-text-secondary"
    />

    @if (suffix) {
      <span class="text-xs text-ims-text-secondary ml-1.5 whitespace-nowrap select-none font-sans">
        {{ suffix }}
      </span>
    }
  </div>

  @if (helperText) {
    <div class="flex items-center gap-1 mt-1 font-sans">
      @if (error) {
        <svg class="flex-shrink-0 w-3 h-3" viewBox="0 0 12 12" fill="currentColor">
          <path
            d="M6 0C2.68629 0 0 2.68629 0 6C0 9.31371 2.68629 12 6 12C9.31371 12 12 9.31371 12 6C12 2.68629 9.31371 0 6 0ZM6.6 8.4H5.4V7.2H6.6V8.4ZM6.6 6H5.4V3.6H6.6V6Z"
          />
        </svg>
      }
      <p
        [ngClass]="{ 'text-ims-error': error, 'text-ims-text-secondary': !error }"
        class="text-xs leading-4 m-0"
      >
        {{ helperText }}
      </p>
    </div>
  }
</div>

<div
  [ngClass]="isPrimary === true ? 'bg-ims-primary' : 'bg-white'"
  class="rounded-xl border border-gray-400 p-6 shadow-md"
>
  <div class="flex items-start justify-between mb-4">
    <h3
      [ngClass]="isPrimary === true ? 'text-white' : ''"
      class="text-sm font-medium text-gray-900 font-heading"
    >
      {{ title }}
    </h3>

    <svg width="21" height="20" viewBox="0 0 21 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M10.3333 10.833C10.7936 10.833 11.1667 10.4599 11.1667 9.99967C11.1667 9.53944 10.7936 9.16634 10.3333 9.16634C9.8731 9.16634 9.5 9.53944 9.5 9.99967C9.5 10.4599 9.8731 10.833 10.3333 10.833Z"
        stroke="#98A2B3"
        stroke-width="1.66667"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M10.3333 4.99967C10.7936 4.99967 11.1667 4.62658 11.1667 4.16634C11.1667 3.7061 10.7936 3.33301 10.3333 3.33301C9.8731 3.33301 9.5 3.7061 9.5 4.16634C9.5 4.62658 9.8731 4.99967 10.3333 4.99967Z"
        stroke="#98A2B3"
        stroke-width="1.66667"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
      <path
        d="M10.3333 16.6663C10.7936 16.6663 11.1667 16.2932 11.1667 15.833C11.1667 15.3728 10.7936 14.9997 10.3333 14.9997C9.8731 14.9997 9.5 15.3728 9.5 15.833C9.5 16.2932 9.8731 16.6663 10.3333 16.6663Z"
        stroke="#98A2B3"
        stroke-width="1.66667"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </div>

  <div class="flex items-end justify-between">
    <div>
      <div
        [ngClass]="isPrimary === true ? 'text-white' : ''"
        class="text-4xl font-semibold text-gray-900 mb-2 font-heading"
      >
        {{ value }}
      </div>
      <div class="flex items-center gap-2">
        <span
          class="flex items-center gap-1 text-sm font-medium"
          [ngClass]="trend === 'up' ? 'text-green-600' : 'text-red-600'"
        >
          <svg *ngIf="trend === 'up'" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path
              d="M8 12V4M8 4L4 8M8 4L12 8"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <svg *ngIf="trend === 'down'" width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path
              d="M8 4V12M8 12L12 8M8 12L4 8"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          <span class="text-sm font-sans">{{ percentage }}%</span>
        </span>
        <span class="text-sm text-gray-500 font-sans">vs last month</span>
      </div>
    </div>

    <div class="w-32 h-16">
      <svg viewBox="0 0 128 64" preserveAspectRatio="none" class="w-full h-full">
        <path
          [attr.d]="chartPath"
          fill="none"
          [attr.stroke]="trend === 'up' ? '#10b981' : '#ef4444'"
          stroke-width="3"
          stroke-linecap="round"
        />
      </svg>
    </div>
  </div>
</div>

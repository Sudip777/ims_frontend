<p-dialog
  [(visible)]="visible"
  [style]="{ width: '900px' }"
  header="Purchase Order Details"
  [modal]="true"
  [draggable]="false"
  (onHide)="cancel.emit()"
>
  <ng-template pTemplate="content">
    <div class="flex flex-col gap-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block font-bold mb-3">Supplier Name</label>
          <input
            pInputText
            [(ngModel)]="purchaseOrder.supplierName"
            placeholder="Supplier Name"
            class="w-full"
          />
        </div>
        <div>
          <label class="block font-bold mb-3">Order Date</label>
          <p-datepicker
            [(ngModel)]="purchaseOrder.orderDate"
            dateFormat="yy-mm-dd"
            [showIcon]="true"
            class="w-full"
          ></p-datepicker>
        </div>
        <div>
          <label class="block font-bold mb-3">Status</label>
          <p-select
            [(ngModel)]="purchaseOrder.statusId"
            [options]="statusOptions"
            optionLabel="label"
            optionValue="value"
            placeholder="Select Status"
            class="w-full"
          ></p-select>
        </div>
        <div>
          <label class="block font-bold mb-3">Total Amount</label>
          <p-inputnumber
            [(ngModel)]="purchaseOrder.totalAmount"
            mode="currency"
            currency="USD"
            class="w-full"
          ></p-inputnumber>
        </div>
      </div>

      <h4 class="font-semibold mt-4">Purchase Order Items</h4>
      <p-table [value]="purchaseOrder.purchaseOrderDetails">
        <ng-template pTemplate="header">
          <tr>
            <th>Product</th>
            <th>Quantity</th>
            <th>Unit Price</th>
            <th>Total</th>
            <th>Actions</th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-detail let-rowIndex="rowIndex">
          <tr>
            <td>
              <input
                pInputText
                [(ngModel)]="detail.productName"
                placeholder="Product"
                class="w-full"
              />
            </td>
            <td>
              <p-inputnumber [(ngModel)]="detail.quantity" class="w-full"></p-inputnumber>
            </td>
            <td>
              <p-inputnumber
                [(ngModel)]="detail.unitPrice"
                mode="currency"
                currency="USD"
                class="w-full"
              ></p-inputnumber>
            </td>
            <td>
              {{ detail.quantity * detail.unitPrice | currency }}
            </td>
            <td>
              <p-button
                icon="pi pi-trash"
                [text]="true"
                severity="danger"
                (onClick)="removeDetail(rowIndex)"
              ></p-button>
            </td>
          </tr>
        </ng-template>
      </p-table>
      <div class="mt-2">
        <p-button icon="pi pi-plus" label="Add Item" (onClick)="addDetail()"></p-button>
      </div>
    </div>
  </ng-template>
  <ng-template pTemplate="footer">
    <p-button label="Cancel" icon="pi pi-times" [text]="true" (onClick)="cancel.emit()" />
    <p-button label="Save" icon="pi pi-check" (onClick)="save.emit(purchaseOrder)" />
  </ng-template>
</p-dialog>

<main class="flex min-h-screen bg-gray-900">
  >
  <section
    class="hidden md:flex md:w-1/2 bg-gradient-to-br from-purple-600 to-purple-700 p-12 flex-col justify-between text-white relative"
  >
    <div class="flex-1 flex items-center justify-center">
      <div class="text-center">
        <div class="bg-white px-12 py-4 inline-block mb-8 rounded-full">
          <app-icon name="app-logo"> </app-icon>
        </div>
        <p class="text-white text-sm max-w-md mx-auto">
          Re-imagining inventory management experience with advance data analytics for optimum
          performance
        </p>
      </div>
    </div>
    <p class="text-purple-200 text-sm">© TheUnityWare 2024</p>
  </section>
  >
  <section class="w-full md:w-1/2 bg-white flex items-center justify-center p-8">
    <div class="w-full max-w-md">
      <div class="mb-8">
        <h1 class="text-3xl font-semibold text-gray-900 mb-2 font-heading">Sign Up</h1>
        <p class="text-gray-600 text-sm font-sm">Please enter your details.</p>
      </div>

      <form class="space-y-5" [formGroup]="loginForm">
        <app-text-field
          label="Username"
          placeholder="Enter your username"
          formControlName="username"
          type="text"
          [required]="true"
          [error]="isFieldInvalid('username')"
        >
        </app-text-field>

        <app-text-field
          label="Password"
          placeholder="Enter your password"
          formControlName="password"
          type="password"
          [required]="true"
          className="border-red-600"
          [error]="isFieldInvalid('password')"
        >
        </app-text-field>
        <div class="flex items-center justify-between">
          <label class="flex items-center">
            <input type="checkbox" class="w-4 h-4 text-purple-600 border-gray-300 focus:ring-0" />
            <span class="ml-2 text-sm text-gray-700">Remember for 30 days</span>
          </label>
          <a href="#" class="text-sm text-purple-600 hover:text-purple-700">Forgot password</a>
        </div>

        <button
          type="button"
          class="w-full text-white bg-colors-ims-primary border bg-ims-primary py-3 hover:bg-colors-ims-primary-hover transition-colors text-sm font-medium cursor-pointer rounded-md shadow-md"
        >
          Signup
        </button>

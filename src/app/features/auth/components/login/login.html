<main class="flex min-h-screen bg-gray-900">
  <!-- Left Section - Purple Background -->
  <section class="hidden md:flex md:w-1/2 bg-gradient-to-br from-purple-600 to-purple-700 p-12 flex-col justify-between text-white relative">
    <div class="flex-1 flex items-center justify-center">
      <div class="text-center">
        <div class="bg-white px-12 py-4 inline-block mb-8 rounded-full">
          <app-icon name="app-logo"> </app-icon>
        </div>
        <p class="text-white text-sm max-w-md mx-auto">
          Re-imagining inventory management experience with advance data analytics for optimum performance
        </p>
      </div>
    </div>
    <p class="text-purple-200 text-sm">© TheUnityWare 2024</p>
  </section>

  <!-- Right Section - White Background -->
  <section class="w-full md:w-1/2 bg-white flex items-center justify-center p-8">
    <div class="w-full max-w-md">
      <div class="mb-8">
        <h1 class="text-3xl font-semibold text-gray-900 mb-2 font-heading">Welcome back</h1>
        <p class="text-gray-600 text-sm font-sm">Welcome back! Please enter your details.</p>
      </div>

      <form class="space-y-5 " [formGroup]="loginForm">
         <app-text-field
          label="Username"
          placeholder="Enter your username"
          formControlName="username"
          type="text"
          [required]="true"
          [error]="isFieldInvalid('username')">
        </app-text-field>

        <app-text-field
          label="Password"
          placeholder="Enter your password"
          formControlName="password"
          type="password"
          [required]="true"
          className="border-red-600"
          [error]="isFieldInvalid('password')">
        </app-text-field>
        <div class="flex items-center justify-between">
          <label class="flex items-center">
            <input type="checkbox" class="w-4 h-4 text-purple-600 border-gray-300 focus:ring-0" />
            <span class="ml-2 text-sm text-gray-700">Remember for 30 days</span>
          </label>
          <a href="#" class="text-sm text-purple-600 hover:text-purple-700">Forgot password</a>
        </div>


          <!-- <app-button type="submit" color="primary" size="lg" [rounded]="false" >
          Signup
         </app-button> -->
          <button
          type="button"
          class="w-full text-white bg-colors-ims-primary  border border-gray-300  py-3 hover:bg-colors-ims-primary-hover transition-colors text-sm font-medium"
        >
          Signup
        </button>



        <button
          type="button"
          class="w-full bg-white border border-gray-300 text-gray-700 py-3 hover:bg-gray-50 transition-colors flex items-center justify-center gap-3 text-sm font-medium"
        >
          <svg class="w-5 h-5" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Sign in with Google
        </button>
      </form>

      <p class="text-center text-sm text-gray-600 mt-6">
        Don't have an account? <a href="#" class="text-purple-600 hover:text-purple-700 font-medium">Sign up</a>
      </p>
    </div>
  </section>
</main>

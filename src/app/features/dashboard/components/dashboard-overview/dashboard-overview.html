<div class="flex h-screen overflow-hidden">
  <main class="flex-1 overflow-y-auto bg-gray-50">
    <div class="p-4 lg:p-8">
      <div class="max-w-7xl mx-auto">
        <h1 class="text-2xl lg:text-3xl font-semibold text-gray-900 mb-6 lg:mb-8 font-heading">
          Welcome back, {{ userName }}
        </h1>

        <div class="flex flex-col lg:flex-row lg:items-center gap-3 mb-6">
          <div class="hidden lg:inline-flex bg-white rounded-lg overflow-x-auto">
            <button
              *ngFor="let period of timePeriods"
              (click)="selectedPeriod = period"
              [ngClass]="
                selectedPeriod === period
                  ? 'bg-gray-50 text-gray-900'
                  : 'text-gray-600 hover:bg-ims-primary-hover-light bg-white'
              "
              class="px-4 lg:px-5 py-2.5 text-sm font-medium transition-colors border-r border-gray-300 cursor-pointer whitespace-nowrap"
              type="button">
              {{ period }}
            </button>
          </div>

          <div class="flex items-center gap-3 lg:ml-auto">
            <button
              class="hidden :inline-flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 shadow-sm">
              <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M11 7V15M7 11H15M21 11C21 16.5228 16.5228 21 11 21C5.47715 21 1 16.5228 1 11C1 5.47715 5.47715 1 11 1C16.5228 1 21 5.47715 21 11Z"
                  stroke="#101828"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
              Add Metrics
            </button>

            <p-datepicker
              [(ngModel)]="date"
              dateFormat="dd M yy"
              showIcon="true"
              placeholder="Select date"
              class="lg:w-auto"></p-datepicker>

            <button
              class="hidden lg:inline-flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-lg text-sm font-medium text-gray-700 hover:bg-gray-50 shadow-sm">
              <svg width="18" height="12" viewBox="0 0 18 12" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M4 6H14M1.5 1H16.5M6.5 11H11.5"
                  stroke="#344054"
                  stroke-width="1.67"
                  stroke-linecap="round"
                  stroke-linejoin="round" />
              </svg>
              Filters
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 lg:gap-6 mb-6">
          <app-metric-card
            title="Average Order Volume"
            value="$208"
            [percentage]="12"
            trend="up"
            chartPath="M 0 48 Q 20 40 40 44 Q 60 48 80 36 Q 100 24 128 8"></app-metric-card>
          <app-metric-card
            title="Transaction Count (Orders)"
            value="100"
            [percentage]="2"
            trend="down"
            chartPath="M 0 16 Q 20 20 40 28 Q 60 36 80 40 Q 100 44 128 48"></app-metric-card>
          <app-metric-card
            title="Products Sold"
            value="270"
            [percentage]="2"
            trend="up"
            chartPath="M 0 48 Q 20 44 40 40 Q 60 36 80 28 Q 100 20 128 8"></app-metric-card>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 lg:gap-6 mb-6 lg:mb-8">
          <app-metric-card
            title="Gross Profit Margin"
            value="69.10%"
            [percentage]="12"
            trend="up"
            chartPath="M 0 48 Q 20 40 40 44 Q 60 48 80 36 Q 100 24 128 8"></app-metric-card>
          <app-metric-card
            title="Gross Profit"
            value="$26.4k"
            [percentage]="2"
            trend="down"
            chartPath="M 0 16 Q 20 20 40 28 Q 60 36 80 40 Q 100 44 128 48"></app-metric-card>
          <app-metric-card
            title="Total Net Revenue"
            value="$1.8m"
            [percentage]="2"
            trend="up"
            chartPath="M 0 48 Q 20 44 40 40 Q 60 36 80 28 Q 100 20 128 8"></app-metric-card>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 lg:gap-8">
          <div class="bg-white p-4 lg:p-6 rounded-2xl shadow-sm">
            <p-chart
              type="bar"
              [data]="stackedBarData"
              [options]="stackedBarOptions"
              class="h-64 lg:h-[30rem]"></p-chart>
          </div>

          <div class="bg-white p-4 lg:p-6 rounded-2xl shadow-sm flex flex-col items-center">
            <p-chart
              type="doughnut"
              [data]="doughnutData"
              [options]="doughnutOptions"
              class="w-full h-64 lg:h-[30rem]"></p-chart>
          </div>

          <div class="bg-white p-4 lg:p-6 rounded-2xl shadow-sm flex flex-col items-center">
            <p-chart type="pie" [data]="pieData" [options]="pieOptions" class="w-full h-64 lg:h-[30rem]"></p-chart>
          </div>

          <div class="bg-white p-4 lg:p-6 rounded-2xl shadow-sm">
            <p-chart type="bar" [data]="normalBarData" [options]="normalBarOptions" class="h-64 lg:h-[30rem]"></p-chart>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
